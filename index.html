<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applicant Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>Applicant Registration</h1>
      <p class="subtitle">Fill in the applicant's details and press Submit.</p>
    </header>

    <form id="applicantForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Juan Dela Cruz" autocomplete="name" />
        <small class="error" data-for="name"></small>
      </div>

      <div class="row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="18" max="100" placeholder="e.g. 25" />
          <small class="error" data-for="age"></small>
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
          <small class="error" data-for="gender"></small>
        </div>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" placeholder="House No., Street, Barangay, City, Province"></textarea>
        <small class="error" data-for="address"></small>
      </div>

      <div class="field">
        <label for="position">Position Applied For</label>
        <input type="text" id="position" name="position" placeholder="e.g. Service Advisor" />
        <small class="error" data-for="position"></small>
      </div>

      <div class="actions">
        <button type="reset" class="btn btn-secondary">Clear</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
